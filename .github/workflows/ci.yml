name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una serie de pushes seguidos cancela las corridas viejas en lugar de
# encolarlas todas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Las pruebas de la API corren contra Postgres real: los modelos usan
    # tipos del dialecto de Postgres y pgvector, así que SQLite no sirve.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: riesgos
          POSTGRES_PASSWORD: riesgos
          POSTGRES_DB: riesgos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riesgos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://riesgos:riesgos@localhost:5432/riesgos_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        # Sin el extra `ml`: arrastra PyTorch y los tests no lo tocan.
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests scripts alembic

      - name: Formato
        run: ruff format --check app tests scripts alembic

      - name: Tests
        # -p no:randomly no hace falta; las pruebas son independientes porque
        # cada una corre dentro de una transacción que se revierte.
        run: pytest tests/ -q

  frontend:
    name: Frontend · tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo se construyen: verifica que los Dockerfile siguen siendo válidos
      # sin publicar nada a ningún registro.
      - name: Construir imagen del backend
        run: docker build -t riesgos-api:ci ./backend

      - name: Construir imagen del frontend
        run: docker build -t riesgos-web:ci ./frontend
