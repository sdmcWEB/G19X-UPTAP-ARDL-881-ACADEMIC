name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una serie de pushes seguidos cancela las corridas viejas en lugar de
# encolarlas todas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        # Sin el extra `ml`: arrastra PyTorch y los tests no lo tocan.
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests scripts alembic

      - name: Formato
        run: ruff format --check app tests scripts alembic

      - name: Tests
        run: pytest tests/ -q

  frontend:
    name: Frontend · tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo se construyen: verifica que los Dockerfile siguen siendo válidos
      # sin publicar nada a ningún registro.
      - name: Construir imagen del backend
        run: docker build -t riesgos-api:ci ./backend

      - name: Construir imagen del frontend
        run: docker build -t riesgos-web:ci ./frontend
