services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/code
      - hfcache:/root/.cache/huggingface
      # La API escribe el archivo al subirlo y el worker lo lee: mismo volumen.
      - archivos:/data/contratos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery worker --loglevel=info --concurrency=2
    env_file: .env
    volumes:
      - ./backend:/code
      - hfcache:/root/.cache/huggingface
      - archivos:/data/contratos
    depends_on:
      - db
      - redis

  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      # Dentro de la red de Compose la API es el servicio `api`, no localhost.
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  archivos:
  hfcache:
