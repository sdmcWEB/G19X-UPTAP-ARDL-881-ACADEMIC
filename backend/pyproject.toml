[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riesgos-contractuales"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "python-multipart>=0.0.12",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "ocrmypdf>=16.6",
    "rapidfuzz>=3.10",
    "reportlab>=4.2",
    "openai>=1.60",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Solo el worker lo necesita, y arrastra PyTorch. Fuera del set base para que
# CI y los tests no paguen la descarga.
ml = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8"]

[tool.setuptools.packages.find]
# Sin esto setuptools intenta adivinar y se atraganta con `seeds/` y
# `alembic/`, que están al mismo nivel que `app/` pero no son paquetes.
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = [
    # El proyecto procesa contratos en español: los guiones largos y las comillas
    # tipográficas dentro de regex y normalizadores son intencionales, no erratas.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# El patrón `param = Depends(...)` es la forma idiomática de declarar
# dependencias en FastAPI: la llamada en el default es intencional.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "app.deps.require_roles",
]

[tool.ruff.lint.per-file-ignores]
# Los scripts ajustan sys.path antes de importar la app.
"scripts/*" = ["E402"]
# Alembic genera estos archivos con su propia plantilla.
"alembic/*" = ["E402", "I001"]
